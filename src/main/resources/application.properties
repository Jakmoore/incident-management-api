# App
spring.application.name=incident-management-api
spring.profiles.active=dev

# Database
spring.flyway.enabled=true
spring.datasource.url=jdbc:postgresql://localhost:5432/incident_platform
spring.datasource.username=app_user
spring.datasource.password=password

# REST
rest.client.connect.timeout=3000
rest.client.read.timeout=3000

# Notification REST
notification.rest.url=http://localhost:5206/notification

# Scheduling
monitor.schedule.rate=30000

# Logging
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO